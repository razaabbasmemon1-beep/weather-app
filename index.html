<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app with API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    .item {
        opacity: 0;
        transform: translateY(-40px);
        transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .item.show {
        opacity: 1;
        transform: translateY(0);
    }
</style>



<body>















    <main class="bg-[#0f1623] min-h-screen flex flex-col items-center gap-12 px-4">
        <h1 class="item text-center pt-16 text-white font-bold text-4xl capitalize">
            Weather App
        </h1>

        <div class="item flex gap-3 w-full max-w-md relative" style="z-index: 50;">
            <input id="cityInput" type="text" placeholder="Search city..."
                class="flex-1 px-4 py-3 rounded-xl bg-[#1a2233] text-white border border-white/10 outline-none placeholder:text-gray-500 focus:border-blue-500 transition-colors" />
            <button id="searchBtn"
                class="px-7 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-all">
                Search
                <i class="ti ti-search"></i>
            </button>

            <ul id="suggestions"
                class="absolute top-full left-0 mt-1 w-full bg-[#1a2233] border border-white/10 rounded-xl overflow-hidden hidden shadow-2xl"
                style="z-index: 9999;"></ul>
        </div>

        <div class="item bg-[#1a2233] rounded-2xl shadow-xl w-full max-w-md p-6 flex flex-col gap-6">
            <div class="flex justify-between items-start">
                <div>
                    <h2 id="cityName" class="text-xl font-bold text-white capitalize">Karachi</h2>
                    <p id="dateTime" class="text-sm text-gray-400 mt-1"></p>
                </div>
                <div class="flex items-center gap-2">
                    <img id="icon" class="w-14 h-14" />
                    <p id="condition" class="text-sm text-gray-300 capitalize"></p>
                </div>
            </div>

            <div class="flex items-baseline gap-1">
                <span id="temperature" class="text-5xl font-bold text-white">36°</span>
                <span class="text-lg text-gray-400">C</span>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="item bg-[#0f1623] rounded-xl p-3 text-center">
                    <i class="ti ti-droplet text-gray-400 text-lg"></i>
                    <p class="text-xs text-gray-400 mt-1">Humidity</p>
                    <p id="humidity" class="text-sm font-bold text-white mt-1">53%</p>
                </div>
                <div class="item bg-[#0f1623] rounded-xl p-3 text-center">
                    <i class="ti ti-wind text-gray-400 text-lg"></i>
                    <p class="text-xs text-gray-400 mt-1">Wind</p>
                    <p id="wind" class="text-sm font-bold text-white mt-1">26 kph</p>
                </div>
                <div class="item bg-[#0f1623] rounded-xl p-3 text-center">
                    <i class="ti ti-temperature text-gray-400 text-lg"></i>
                    <p class="text-xs text-gray-400 mt-1">Feels like</p>
                    <p id="feelsLike" class="text-sm font-bold text-white mt-1">45°C</p>
                </div>
            </div>
        </div>







    </main>








</body>

<script>





    function getWeather(city) {
        fetch(`https://api.weatherapi.com/v1/current.json?key=ceb327afe8d7478fb4055409261106&q=${city}`)
            .then(raw => raw.json())
            .then(data => {
                document.getElementById("cityName").textContent = data.location.name;
                document.getElementById("icon").src = "https:" + data.current.condition.icon;
                document.getElementById("temperature").textContent = data.current.temp_c + "°C";
                document.getElementById("condition").textContent = data.current.condition.text;
                document.getElementById("humidity").textContent = "Humidity: " + data.current.humidity + "%";
                document.getElementById("wind").textContent = "Wind: " + data.current.wind_kph + " kph";
                document.getElementById("feelsLike").textContent = "Feels like: " + data.current.feelslike_c + "°C";
                document.getElementById("dateTime").textContent = data.location.localtime;

                localStorage.setItem("lastCity", data.location.name);
            })
    }

    const lastCity = localStorage.getItem("lastCity") || "Karachi";
    getWeather(lastCity);

    document.getElementById("searchBtn").addEventListener("click", function () {
        let city = document.getElementById("cityInput").value;
        if (city === "") return;
        getWeather(city);
    })



    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
                setTimeout(() => {
                    entry.target.classList.add('show');
                }, i * 100);
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.2
    });

    document.querySelectorAll('.item').forEach(el => observer.observe(el));




    const cities = ["Karachi", "Lahore", "Islamabad", "Kabul", "Kano", "Kuala Lumpur", "London", "Multan", "Quetta", "Sukkur"];
    const suggestionsBox = document.getElementById("suggestions");

    document.getElementById("cityInput").addEventListener("input", function () {
        const value = this.value.toLowerCase();
        suggestionsBox.innerHTML = "";

        if (value === "") {
            suggestionsBox.classList.add("hidden");
            return;
        }

        const matches = cities.filter(city => city.toLowerCase().startsWith(value));

        if (matches.length === 0) {
            suggestionsBox.classList.add("hidden");
            return;
        }

        matches.forEach(city => {
            const li = document.createElement("li");
            li.textContent = city;
            li.className = " px-4 py-2 text-white cursor-pointer hover:bg-blue-600 transition-colors";
            li.addEventListener("click", () => {
                document.getElementById("cityInput").value = city;
                suggestionsBox.classList.add("hidden");
                getWeather(city);
            });
            suggestionsBox.appendChild(li);
        });

        suggestionsBox.classList.remove("hidden");
    });





    document.getElementById("cityInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            const city = this.value.trim();
            if (city === "") return;
            suggestionsBox.classList.add("hidden");
            getWeather(city);
        }
    });







</script>


</html>
